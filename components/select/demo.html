<div class="demo-form">
  <div class="kit-field">
    <label for="sel-a">Label</label>
    <select class="kit-select" id="sel-a"><option>Option one</option><option>Option two</option><option>Option three</option></select>
  </div>
  <div class="kit-field">
    <label for="sel-b">With a placeholder</label>
    <select class="kit-select" id="sel-b" required aria-describedby="sel-b-hint"><option value="" disabled selected>Choose an option</option><option>Option one</option><option>Option two</option></select>
    <p class="kit-field-hint" id="sel-b-hint">Hint text below the control.</p>
  </div>
  <div class="kit-field">
    <label for="sel-c">Grouped</label>
    <select class="kit-select" id="sel-c"><optgroup label="Group one"><option>Option one</option><option>Option two</option></optgroup><optgroup label="Group two"><option>Option three</option></optgroup></select>
  </div>
  <div class="kit-field">
    <label for="sel-d">Disabled</label>
    <select class="kit-select" id="sel-d" disabled><option>Option one</option></select>
  </div>
</div>
