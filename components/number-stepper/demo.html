<div class="demo-form">
  <div class="kit-field"><label for="st-a">Quantity</label><div class="kit-stepper"><button type="button" data-step="down" aria-label="Decrease quantity">−</button><input class="kit-input" id="st-a" type="number" min="1" max="10" value="2"><button type="button" data-step="up" aria-label="Increase quantity">+</button></div></div>
  <div class="kit-field"><label for="st-b">Amount</label><div class="kit-stepper"><button type="button" data-step="down" aria-label="Decrease amount">−</button><input class="kit-input" id="st-b" type="number" min="0" step="0.5" value="2.5" aria-describedby="st-b-hint"><button type="button" data-step="up" aria-label="Increase amount">+</button></div><p class="kit-field-hint" id="st-b-hint">In steps of 0.5.</p></div>
</div>
