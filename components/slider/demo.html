<div class="kit-stack demo-fill" data-gap="5">
  <div class="kit-slider-field">
    <label for="sl-a">Label</label>
    <output for="sl-a" data-format="percent"></output>
    <input type="range" class="kit-slider" id="sl-a" min="0" max="100" value="40">
  </div>
  <div class="kit-slider-field">
    <label for="sl-b">With steps and a unit</label>
    <output for="sl-b" data-unit="GB"></output>
    <input type="range" class="kit-slider" id="sl-b" min="10" max="200" step="10" value="120" aria-describedby="sl-b-hint">
    <p class="kit-field-hint" id="sl-b-hint">Hint text below the control.</p>
  </div>
  <div class="kit-slider-field">
    <label for="sl-c">Disabled</label>
    <output for="sl-c"></output>
    <input type="range" class="kit-slider" id="sl-c" value="70" disabled>
  </div>
</div>
