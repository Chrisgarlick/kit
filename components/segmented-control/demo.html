{{$d := .Data}}
<div class="demo-stack">
  <kit-segmented aria-label="Date range" name="range" value="{{index $d.ranges 1}}" data-demo-note="seg-out">
    {{$current := index $d.ranges 1}}{{range $d.ranges}}<button value="{{.}}" aria-checked="{{if eq . $current}}true{{else}}false{{end}}">{{.}}</button>{{end}}
  </kit-segmented>
  <p class="demo-note" id="seg-out">Showing {{$d.company.name}}'s numbers for the last {{index $d.ranges 1}}.</p>
</div>
