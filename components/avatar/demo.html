{{$d := .Data}}
<div class="demo-stack">
  <div class="demo-row">{{range $i, $p := $d.people}}<span class="kit-avatar" data-tone="{{inc $i}}" role="img" aria-label="{{$p.name}}">{{$p.initials}}</span>{{end}}</div>
  <div class="demo-row"><span class="kit-avatar" data-size="sm" data-tone="2" role="img" aria-label="Sam Okafor">SO</span><span class="kit-avatar" data-tone="2" role="img" aria-label="Sam Okafor">SO</span><span class="kit-avatar" data-size="lg" data-tone="2" role="img" aria-label="Sam Okafor">SO</span></div>
  <div class="demo-row">
    <span class="kit-avatar-group" role="img" aria-label="{{(index $d.people 0).name}}, {{(index $d.people 1).name}}, {{(index $d.people 2).name}} and 2 others">{{range $i, $p := $d.people}}{{if lt $i 3}}<span class="kit-avatar" data-tone="{{inc $i}}" aria-hidden="true">{{$p.initials}}</span>{{end}}{{end}}<span class="kit-avatar" data-more aria-hidden="true">+2</span></span>
    <span class="demo-note">{{len $d.people}} people in {{$d.company.name}}</span>
  </div>
</div>
