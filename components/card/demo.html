{{$d := .Data}}
<div class="demo-cards">
  {{range $d.invoices}}
  <article class="kit-card">
    <header class="kit-card-header"><h3><a class="kit-card-link" href="#card">{{.number}}</a></h3><span class="kit-badge" data-tone="{{if eq .status "Paid"}}good{{else if eq .status "Due"}}warn{{else}}bad{{end}}">{{.status}}</span></header>
    <div class="kit-card-body"><p>{{.customer}}</p></div>
    <footer class="kit-card-footer"><span class="demo-figure">{{.amount}}</span><button class="kit-button" data-size="sm" data-variant="ghost" type="button" aria-label="Download {{.number}}">Download</button></footer>
  </article>
  {{end}}
</div>
