[package]
name = "kit-render"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "kit's chart renderer for Rust: data and a brand theme in, standalone SVG out, through embedded QuickJS."
repository = "https://github.com/Chrisgarlick/kit"

[dependencies]
rquickjs = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
