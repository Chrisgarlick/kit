# Base theme in the Brutalist editorial style (Hub library: test): condensed
# uppercase display on a warm grey canvas, white and black flat panels, a mint
# accent for tags and a yellow spark. Paste into Clients
# (clients.kritano.com/c/base-brutalist), save, publish.
brand: 1
name: Base theme, Brutalist

palette:
  paper: "#E5E5E5"            # Warm Canvas: never pure white underneath
  surface: "#FFFFFF"          # cards lift off the canvas by colour, not shadow
  ink: "#000000"
  ink-muted: "#444444"
  heading: "#000000"
  rule: "#C6C6C6"
  accent: "#000000"           # actions are black blocks
  accent-soft: "#D1FFCA"      # Mint Chip, tags only
  accent-2: "#FFF100"         # Voltage Yellow, micro-accents only
  on-accent: "#FFFFFF"
  inverse: "#000000"
  on-inverse: "#FFFFFF"
  good: "#1F7A4D"
  fair: "#8A5A12"
  poor: "#B42318"

modes:
  dark:
    paper: "#111111"
    surface: "#1E1E1E"
    ink: "#F3F3F3"
    ink-muted: "#B0B0B0"
    heading: "#FFFFFF"
    rule: "#3A3A3A"
    accent: "#F3F3F3"
    accent-soft: "#1F3A1C"
    accent-2: "#FFF100"
    on-accent: "#000000"
    inverse: "#F3F3F3"
    on-inverse: "#000000"
    good: "#4ADE80"
    fair: "#FACC15"
    poor: "#F87171"

type:
  display: { font: "lib:anton", weight: 400, tracking: -0.01em, leading: 0.92 }
  heading: { font: "Inter Tight", weight: 500, tracking: -0.02em, leading: 1.1 }
  body:    { font: "Inter", weight: 400, leading: 1.3 }
  mono:    { font: "JetBrains Mono", weight: 400 }

shape:
  radius: { sm: 6px, md: 24px, lg: 48px }
  shadow: { color: "#000000", opacity: 0.0, blur: 0px, y: 0px }   # flat by design
  stroke: 1.5px

wordmark: Your brand
