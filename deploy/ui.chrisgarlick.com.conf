# ui.chrisgarlick.com: kit's static documentation site. No app server: nginx
# serves /var/www/ui/current, which `kit site deploy` switches atomically.
# Install: certbot certonly --nginx -d ui.chrisgarlick.com, copy this to
# /etc/nginx/sites-available/, link it into sites-enabled, nginx -t, reload.

server {
    listen 80;
    listen [::]:80;
    server_name ui.chrisgarlick.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://ui.chrisgarlick.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ui.chrisgarlick.com;
    ssl_certificate /etc/letsencrypt/live/ui.chrisgarlick.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ui.chrisgarlick.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    root /var/www/ui/current;
    charset utf-8;
    gzip_static on;
    error_page 404 /404.html;

    # nginx drops a server's add_header lines in any location that adds its
    # own, so every location includes the full set.
    set $csp "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests";

    # Fingerprinted bundles and fonts: cache for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy $csp always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        try_files $uri =404;
    }

    # Pages: always revalidate, so a deploy shows at once.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $csp always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        try_files $uri $uri/index.html =404;
    }
}
